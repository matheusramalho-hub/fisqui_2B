<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Fantástica Fábrica - Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #2b003b 0%, #4a125e 50%, #1a0022 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #ffd700;
      margin-bottom: 5px;
      text-shadow: 2px 2px 4px #000;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      max-width: 800px;
      width: 100%;
      margin-top: 20px;
      justify-content: center;
    }

    .click-section {
      flex: 1;
      min-width: 280px;
      background: #3b1347;
      border: 3px solid #ffd700;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .score-display {
      font-size: 2.5rem;
      color: #ffd700;
      font-weight: bold;
      margin: 10px 0;
    }

    .cps-display {
      color: #d1b3e0;
      font-size: 1rem;
      margin-bottom: 25px;
    }

    .chocolate-btn {
      font-size: 90px;
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease;
      display: inline-block;
      outline: none;
    }

    .chocolate-btn:active {
      transform: scale(0.85);
    }

    .upgrades-section {
      flex: 1;
      min-width: 280px;
      background: #3b1347;
      border: 3px solid #ffd700;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .upgrades-section h2 {
      color: #ffd700;
      margin-bottom: 15px;
      border-bottom: 2px dashed #ffd700;
      padding-bottom: 8px;
    }

    .upgrade-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid #8e44ad;
      color: #fff;
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      text-align: left;
    }

    .upgrade-btn:hover:not(:disabled) {
      background: #8e44ad;
      border-color: #ffd700;
    }

    .upgrade-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: #555;
    }

    .upgrade-title {
      font-weight: bold;
      color: #ffd700;
    }

    .upgrade-desc {
      font-size: 0.8rem;
      color: #e0d0f0;
    }

    .upgrade-count {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <h1>🍫 Fantástica Fábrica Clicker 🎩</h1>

  <div class="container">
    <!-- Seção de Clicar -->
    <div class="click-section">
      <div class="score-display" id="chocolates">0</div>
      <div class="cps-display">Por segundo: <span id="cps">0</span></div>
      
      <button class="chocolate-btn" id="click-btn" onclick="clicar()">🍫</button>
      <p style="margin-top: 15px; font-size: 0.9rem; color: #d1b3e0;">Clique no chocolate para produzir!</p>
    </div>

    <!-- Seção de Melhorias -->
    <div class="upgrades-section">
      <h2>Melhorias da Fábrica</h2>

      <button class="upgrade-btn" id="upg-oompa" onclick="comprar('oompa')">
        <div>
          <div class="upgrade-title">👨‍🍳 Oompa Loompa</div>
          <div class="upgrade-desc">+1/seg | Custo: <span id="cost-oompa">15</span></div>
        </div>
        <div class="upgrade-count" id="count-oompa">0</div>
      </button>

      <button class="upgrade-btn" id="upg-rio" onclick="comprar('rio')">
        <div>
          <div class="upgrade-title">🌊 Rio de Chocolate</div>
          <div class="upgrade-desc">+5/seg | Custo: <span id="cost-rio">100</span></div>
        </div>
        <div class="upgrade-count" id="count-rio">0</div>
      </button>

      <button class="upgrade-btn" id="upg-maquina" onclick="comprar('maquina')">
        <div>
          <div class="upgrade-title">⚙️ Máquina Doceira</div>
          <div class="upgrade-desc">+20/seg | Custo: <span id="cost-maquina">500</span></div>
        </div>
        <div class="upgrade-count" id="count-maquina">0</div>
      </button>

      <button class="upgrade-btn" id="upg-wonka" onclick="comprar('wonka')">
        <div>
          <div class="upgrade-title">🎩 Segredo do Willy Wonka</div>
          <div class="upgrade-desc">+100/seg | Custo: <span id="cost-wonka">2000</span></div>
        </div>
        <div class="upgrade-count" id="count-wonka">0</div>
      </button>
    </div>
  </div>

  <script>
    let chocolates = 0;

    const upgrades = {
      oompa: { quantidade: 0, custo: 15, cps: 1 },
      rio: { quantidade: 0, custo: 100, cps: 5 },
      maquina: { quantidade: 0, custo: 500, cps: 20 },
      wonka: { quantidade: 0, custo: 2000, cps: 100 }
    };

    function clicar() {
      chocolates += 1;
      atualizarTela();
    }

    function calcularCPS() {
      let totalCPS = 0;
      for (let key in upgrades) {
        totalCPS += upgrades[key].quantidade * upgrades[key].cps;
      }
      return totalCPS;
    }

    function comprar(tipo) {
      let upg = upgrades[tipo];
      if (chocolates >= upg.custo) {
        chocolates -= upg.custo;
        upg.quantidade++;
        upg.custo = Math.floor(upg.custo * 1.15); // Aumenta o preço em 15%
        atualizarTela();
      }
    }

    function atualizarTela() {
      document.getElementById('chocolates').innerText = Math.floor(chocolates);
      document.getElementById('cps').innerText = calcularCPS();

      for (let key in upgrades) {
        let upg = upgrades[key];
        document.getElementById(`cost-${key}`).innerText = upg.custo;
        document.getElementById(`count-${key}`).innerText = upg.quantidade;
        document.getElementById(`upg-${key}`).disabled = chocolates < upg.custo;
      }
    }

    // Produção automática a cada 100ms
    setInterval(() => {
      let cps = calcularCPS();
      if (cps > 0) {
        chocolates += cps / 10;
        atualizarTela();
      }
    }, 100);

    atualizarTela();
  </script>
</body>
</html>

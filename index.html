<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Aventura do Oompa Loompa - Fase Longa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #2b003b 0%, #4a125e 50%, #1a0022 100%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    h1 {
      color: #ffd700;
      text-shadow: 2px 2px 4px #000;
      margin-bottom: 5px;
      font-size: 1.8rem;
    }

    .instructions {
      color: #e0d0f0;
      font-size: 0.9rem;
      margin-bottom: 15px;
      text-align: center;
    }

    .game-container {
      position: relative;
      border: 4px solid #ffd700;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      background: #11001c;
      overflow: hidden;
    }

    canvas {
      display: block;
      background: #230833;
    }

    .mobile-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
      margin-top: 15px;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .ctrl-btn {
      background: #ffd700;
      color: #2b003b;
      border: none;
      padding: 15px 22px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 0 #b39700;
    }

    .ctrl-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffd700;
      min-height: 25px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>🍫 A Grande Aventura na Fábrica 🎩</h1>
  <p class="instructions">Use as <b>Setas (← →)</b> ou <b>A/D</b> para andar e <b>Espaço / Seta para Cima (↑)</b> para pular!</p>

  <div class="game-container">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div class="status-msg" id="statusMsg">Colete os 8 Cupons Dourados ao longo da fábrica!</div>

  <!-- Controles para Dispositivos Móveis -->
  <div class="mobile-controls">
    <div class="btn-group">
      <button class="ctrl-btn" id="btnLeft">◄</button>
      <button class="ctrl-btn" id="btnRight">►</button>
    </div>
    <button class="ctrl-btn" id="btnJump">PULAR ⬆</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('statusMsg');

    // Configurações do Mundo
    const WORLD_WIDTH = 2800; // Fase expandida (3.5x maior)
    let cameraX = 0;
    let gameWon = false;
    let score = 0;
    const totalTickets = 8;

    // Teclas
    const keys = { left: false, right: false, up: false };

    // Jogador (Oompa Loompa)
    const player = {
      x: 50,
      y: 300,
      w: 30,
      h: 40,
      vx: 0,
      vy: 0,
      speed: 4.5,
      jumpStrength: -11.5,
      gravity: 0.5,
      grounded: false
    };

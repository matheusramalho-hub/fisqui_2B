<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fantástica Fábrica - Pegue o Chocolate!</title>
  <style>
    body {
      text-align: center;
      font-family: 'Arial', sans-serif;
      background-color: #2b102f;
      color: #ffd700;
      margin-top: 30px;
    }

    /* Área onde o chocolate vai aparecer */
    #fabrica {
      width: 400px;
      height: 400px;
      border: 4px solid #ffd700;
      background-color: #4a1f52;
      margin: 20px auto;
      position: relative;
      border-radius: 15px;
      overflow: hidden;
    }

    /* O chocolate que se move */
    #chocolate {
      width: 60px;
      height: 60px;
      font-size: 40px;
      position: absolute;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button {
      background-color: #ffd700;
      color: #2b102f;
      border: none;
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background-color: #fff;
    }
  </style>
</head>
<body>

  <h1>🍫 Fábrica do Willy Wonka 🍫</h1>
  <p>Pontos: <span id="pontos">0</span> | Tempo: <span id="tempo">15</span>s</p>

  <div id="fabrica">
    <div id="chocolate" onclick="pegarChocolate()">🍫</div>
  </div>

  <button id="btn-inicio" onclick="iniciarJogo()">Começar Jogo</button>

  <script>
    let pontos = 0;
    let tempo = 15;
    let timer = null;

    function iniciarJogo() {
      pontos = 0;
      tempo = 15;
      document.getElementById("pontos").innerText = pontos;
      document.getElementById("tempo").innerText = tempo;
      document.getElementById("btn-inicio").disabled = true;

      moverChocolate();

      // Contador do tempo (diminui 1 segundo a cada 1000ms)
      clearInterval(timer);
      timer = setInterval(() => {
        tempo--;
        document.getElementById("tempo").innerText = tempo;

        if (tempo <= 0) {
          clearInterval(timer);
          alert("Tempo esgotado! Você pegou " + pontos + " chocolates do Wonka!");
          document.getElementById("btn-inicio").disabled = false;
        }
      }, 1000);
    }

    // Função para quando clica no chocolate
    function pegarChocolate() {
      if (tempo > 0) {
        pontos++;
        document.getElementById("pontos").innerText = pontos;
        moverChocolate();
      }
    }

    // Move o chocolate para uma posição aleatória dentro do quadro
    function moverChocolate() {
      let area = document.getElementById("fabrica");
      let x = Math.floor(Math.random() * (area.clientWidth - 60));
      let y = Math.floor(Math.random() * (area.clientHeight - 60));

      let doc = document.getElementById("chocolate");
      doc.style.left = x + "px";
      doc.style.top = y + "px";
    }
  </script>

</body>
</html>
